ransform .16s ease,background .16s ease;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none}.button:hover:not(:disabled){background:#e5f4f7;transform:translateY(-1px)} .button.secondary{background:transparent;color:var(--ink);border-color:#5d7284}.button.secondary:hover{background:#21384b}.button:disabled{cursor:not-allowed;opacity:.45}.button.warning{background:#f0d69a;color:#352717}.actionline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0 0}.fine{font-size:.84rem;color:#acc0cf}.question-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.tracker{font-size:.85rem;color:var(--muted);font-weight:700}.progress{height:8px;border-radius:30px;overflow:hidden;background:#34475a}.progress>div{height:100%;background:linear-gradient(90deg,#6bd6c5,#a7e3dd);border-radius:30px;transition:width .25s ease}.qtitle{font-size:clamp(1.35rem,3.5vw,2rem);font-weight:780;line-height:1.3;letter-spacing:-.02em;margin:28px 0}.choice-list{display:grid;gap:12px}.choice{width:100%;border:1px solid #4b6071;background:#1b3348;border-radius:13px;color:var(--ink);text-align:left;padding:16px 18px;display:flex;align-items:flex-start;gap:15px;min-height:64px;transition:border-color .15s ease,background .15s ease}.choice:hover:not(:disabled){background:#254258;border-color:#8dcfe0}.choice:disabled{cursor:default}.choice .letter{flex:none;display:grid;place-items:center;width:30px;height:30px;font-size:.86rem;font-weight:800;color:#c9e8ed;background:#315167;border-radius:9px}.choice .optionText{flex:1}.choice.locked{opacity:.68}.choice.correct{border:2px solid #68d9ab;background:#173c33;opacity:1}.choice.correct .letter{color:#0e2d22;background:#9deac5}.choice.wrong{border:2px solid #ff9da4;background:#462a35;opacity:1}.choice.wrong .letter{color:#4b1c27;background:#ffd1d3}.choice .status{font-size:.82rem;font-weight:800;margin-left:5px;white-space:nowrap}.feedback{margin-top:20px;border-radius:14px;padding:19px 21px;border:1px solid}.feedback.good{background:var(--mintBg);border-color:#4b9979}.feedback.bad{background:var(--roseBg);border-color:#9b5968}.feedback strong{font-size:1.1rem}.feedback p{margin:7px 0 0;color:#e2e9ed}.feedback small{display:block;margin-top:11px;color:#c3d5df}.feedback.good strong{color:var(--mint)}.feedback.bad strong{color:var(--rose)} .actions{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:24px;flex-wrap:wrap}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.metric{padding:22px 16px;background:#172d3f;border:1px solid var(--line);border-radius:14px}.metric .big{font-size:clamp(1.5rem,3.5vw,2.5rem);font-weight:800;line-height:1.2;letter-spacing:-.04em}.metric .kicker{color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:7px}.successText{color:var(--mint)}.retryText{color:var(--amber)}.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.topicItem{background:#132c3b;border:1px solid #345266;border-radius:11px;padding:10px 15px;font-size:.87rem;display:flex;justify-content:space-between;gap:8px}.topicItem b{font-variant-numeric:tabular-nums}.review-list{display:grid;gap:12px;margin-top:14px}.reviewItem{padding:18px;border-radius:13px;border:1px solid #40586a;background:#102333}.reviewItem p{margin:6px 0;font-size:.95rem}.reviewItem .wrong-answer{color:var(--rose)}.reviewItem .right-answer{color:var(--mint)}.reviewItem .ref{color:var(--muted);font-size:.82rem}.rule{border-top:1px solid var(--line);padding-top:20px;margin-top:26px}.footer{padding:27px 0 42px;color:#99b0c2;border-top:1px solid #ffffff22;font-size:.83rem}.footer .wrap{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.hide{display:none!important}.notice{border:1px solid #706347;background:#372f24;color:#f5dc9f;border-radius:12px;padding:11px 15px;font-size:.85rem}.confetti{font-size:1.55rem;margin-bottom:6px}.secondaryText{color:var(--muted)}.topic-label{color:#a9c8d8;font-size:.87rem;font-weight:650}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0} @media(max-width:620px){.cards,.topic-grid{grid-template-columns:1fr}.result-grid{grid-template-columns:repeat(2,1fr)}.topbar small{display:none}.topbar .wrap{padding:12px 0}.question-head{align-items:flex-start}main{padding-top:25px}.qtitle{margin:24px 0}.actions .button{width:100%}.feedback{padding:15px}} @media print{body{background:#fff;color:#111}.topbar,.actionline,.actions,.footer,.button{display:none!important}.panel,.card,.metric,.reviewItem{color:#111;background:#fff;border-color:#bbb;box-shadow:none}.lede,.secondaryText,.fine{color:#444}a{color:#123}main{padding:0}}
.topbar-actions{display:flex;align-items:center;gap:16px}.reset-button{padding:8px 12px;font-size:.85rem;white-space:nowrap}@media(max-width:620px){.brand{font-size:.72rem;letter-spacing:.06em}.mark{margin-right:6px}.topbar-actions{gap:6px}.reset-button{padding:8px 10px}}

const DATA = {"sets":[[{"q":"What shape is a standard STOP sign?","options":["Red octagon","Yellow diamond","White rectangle","Red triangle"],"a":0,"why":"A STOP sign is red with eight sides and white letters.","page":38,"category":"Signs & markings"},{"q":"What shape identifies a YIELD sign?","options":["Red octagon","Downward-pointing red-and-white triangle","Yellow circle","White pentagon"],"a":1,"why":"A yield sign is a red-and-white triangle pointing down; slow and give way as required.","page":38,"category":"Signs & markings"},{"q":"A yellow diamond-shaped sign normally warns you about what?","options":["A required parking permit","A nearby rest area","A possible road hazard ahead","A toll collection point"],"a":2,"why":"Yellow diamond signs are warnings about dangers or changing road conditions ahead.","page":35,"category":"Signs & markings"},{"q":"Orange road signs with black symbols usually mean what?","options":["School crossing","Railroad crossing","Scenic route","Construction or maintenance zone"],"a":3,"why":"Orange signs alert drivers to road work, workers, detours, or changed surfaces.","page":37,"category":"Signs & markings"},{"q":"Which sign shape is associated with schools?","options":["Pentagon","Octagon","Circle","Horizontal oval"],"a":0,"why":"A pentagon shape identifies school-related signs.","page":41,"category":"Signs & markings"},{"q":"A round yellow sign with a black X and RR warns of what?","options":["A one-way street","A railroad crossing ahead","A hospital entrance","A traffic circle"],"a":1,"why":"The advance railroad crossing warning sign is round and yellow with an X and RR.","page":36,"category":"Signs & markings"},{"q":"White rectangular signs most commonly tell drivers about what?","options":["Scenic attractions","Pavement damage","Traffic regulations","Upcoming railroad tracks"],"a":2,"why":"Regulatory signs typically use white with black or red markings to state rules you must obey.","page":38,"category":"Signs & markings"},{"q":"What do green road guide signs typically show?","options":["Construction detours only","Special hazards only","School-zone speed limits only","Directions and destinations"],"a":3,"why":"Green guide signs usually provide route or destination guidance.","page":38,"category":"Signs & markings"},{"q":"A red circle with a diagonal slash over a maneuver means what?","options":["That maneuver is prohibited","That maneuver is recommended","That maneuver must be completed","That maneuver is permitted only at night"],"a":0,"why":"A red circle and slash indicate a prohibited action.","page":38,"category":"Signs & markings"},{"q":"What should you do if you see a WRONG WAY sign ahead?","options":["Continue until the next traffic light","Do not continue in that direction","Increase speed to leave quickly","Move to the left shoulder and keep driving"],"a":1,"why":"WRONG WAY warns that you are driving against the permitted direction, often near exit ramps.","page":38,"category":"Signs & markings"},{"q":"What is a shared center left-turn lane for?","options":["Driving straight when other lanes are crowded","Passing slower vehicles","Left turns from either direction","Emergency parking"],"a":2,"why":"The shared center lane is reserved for left turns, not through travel or passing.","page":38,"category":"Signs & markings"},{"q":"Your side of the center line is broken yellow and the other side is solid yellow. When may you pass?","options":["Never, under any conditions","Only after dark","Only if the other driver signals","When it is safe and passing is otherwise legal"],"a":3,"why":"Passing is permitted from the side with the broken yellow line when conditions allow.","page":47,"category":"Signs & markings"},{"q":"What does a double solid yellow center line normally prohibit?","options":["Passing across the lines from either direction","Stopping at intersections","Turning left into a driveway","Driving below the posted limit"],"a":0,"why":"A double solid yellow line marks a no-passing condition for traffic in both directions.","page":39,"category":"Signs & markings"},{"q":"What do broken white lane lines generally separate?","options":["Traffic traveling in opposite directions","Lanes traveling in the same direction","A bicycle lane and a sidewalk","A railroad right-of-way"],"a":1,"why":"White lane markings separate traffic flowing in the same direction; broken lines allow lawful lane changes.","page":39,"category":"Signs & markings"},{"q":"At a STOP sign with a white stop line before the crosswalk, where should you stop?","options":["Inside the crosswalk","After passing the crosswalk","Before the stop line","Only where another driver can see you"],"a":2,"why":"The stop line comes first: stop fully behind it before proceeding.","page":39,"category":"Signs & markings"},{"q":"A flashing red traffic light requires which action?","options":["Slow but do not stop","Stop only when a pedestrian is present","Yield without slowing","Stop completely and proceed when clear"],"a":3,"why":"Flashing red means a full stop, followed by proceeding when safe.","page":35,"category":"Traffic signals"},{"q":"What does a flashing yellow traffic signal mean?","options":["Slow down and proceed cautiously","Make a full stop every time","Turn right only","The road is closed"],"a":0,"why":"A flashing yellow light tells drivers to slow and watch for others.","page":35,"category":"Traffic signals"},{"q":"You approach a steady yellow light before entering the intersection. What should you do?","options":["Accelerate through the intersection","Stop if you can do so safely","Always reverse away from the light","Ignore the signal if no cars are coming"],"a":1,"why":"Yellow means the light is about to turn red; stop when it is safe to stop.","page":35,"category":"Traffic signals"},{"q":"When may you generally make a right turn at a red light in Kentucky?","options":["Anytime, without stopping","Only if another driver waves you through","After stopping, yielding, and checking that no sign forbids it","Never, because red means all turns are prohibited"],"a":2,"why":"Right on red is generally allowed after a full stop when the path is clear and not prohibited.","page":35,"category":"Traffic signals"},{"q":"Which left turn may be legal on red after a full stop and yielding?","options":["From a two-way street onto a two-way street","From a two-way street onto a one-way street","From a one-way street onto a two-way street","From one one-way street onto another one-way street"],"a":3,"why":"Kentucky permits left on red only from a one-way street to a one-way street, after stopping and yielding.","page":35,"category":"Traffic signals"},{"q":"You are turning left on a steady green light while an oncoming car continues straight. Who yields?","options":["You, the left-turning driver","The oncoming driver","The driver in the larger vehicle","Whichever driver arrived second"],"a":0,"why":"A left turn on green must yield to oncoming through traffic and pedestrians.","page":35,"category":"Right-of-way"},{"q":"Two drivers arrive at a four-way STOP at the same time. Who generally goes first?","options":["The driver on the left","The driver on the right","The driver turning left","The driver who flashes headlights"],"a":1,"why":"When two vehicles arrive simultaneously, yield to the driver on your right.","page":34,"category":"Right-of-way"},{"q":"At a four-way STOP, one vehicle arrived and stopped before you. What should you do?","options":["Go first if you are turning right","Go first if you are on the wider road","Yield to the vehicle that arrived first","Use your horn to decide"],"a":2,"why":"The driver who is already at the intersection before you generally proceeds first.","page":34,"category":"Right-of-way"},{"q":"You are leaving a driveway to enter a public road. Who must yield?","options":["Vehicles already on the public road","Only pedestrians","Only vehicles turning left","You must yield to highway traffic"],"a":3,"why":"Drivers entering a public road from a driveway or private road must yield to road traffic.","page":34,"category":"Right-of-way"},{"q":"While entering an interstate using an acceleration ramp, who has right-of-way?","options":["Drivers already on the interstate","Drivers on the ramp","The vehicle moving faster","The vehicle with its hazard lights on"],"a":0,"why":"Traffic on the interstate has right-of-way; the merging driver must find a safe gap.","page":34,"category":"Right-of-way"},{"q":"A police officer directs you to proceed although a signal is red. What controls?","options":["The red signal alone","The officer's directions","The lane arrows only","The closest posted speed sign"],"a":1,"why":"Follow traffic directions from an officer even when they differ from traffic signals.","page":34,"category":"Right-of-way"},{"q":"When entering a roundabout, what should you do?","options":["Stop inside the circle","Enter clockwise","Yield to vehicles already circulating","Speed up to claim the lane"],"a":2,"why":"Roundabout traffic moves counterclockwise, and vehicles entering must yield.","page":44,"category":"Right-of-way"},{"q":"A school bus is stopped with its stop arm and lights activated on a normal two-lane road. What must traffic from both directions do?","options":["Only traffic behind the bus must stop","Opposing traffic may pass slowly","Both directions may continue if no children are visible","Both directions must stop"],"a":3,"why":"On an ordinary two-lane roadway, traffic in both directions must stop for the loading or unloading bus.","page":44,"category":"School buses"},{"q":"When does the Kentucky school-bus stopping exception apply to opposite-direction traffic?","options":["On a four-or-more-lane road separated by an elevated barrier or unpaved median","On any road with a painted center line","On any road with three total lanes","Whenever the bus is on the far side of the street"],"a":0,"why":"Opposing traffic may proceed only on the qualifying four-or-more-lane roadway with an elevated barrier or unpaved median.","page":44,"category":"School buses"},{"q":"After stopping for a school bus loading children, when may you continue?","options":["As soon as the stop arm starts retracting","After people are clear of the roadway and the bus is in motion","After counting five seconds","As soon as you hear the school bell"],"a":1,"why":"The manual requires you to remain stopped until people are clear and the bus has begun moving again.","page":44,"category":"School buses"},{"q":"How far before a turn at an intersection should you signal?","options":["25 feet","50 feet","100 feet","300 feet"],"a":2,"why":"Signal at least 100 feet ahead of the turn.","page":42,"category":"Important numbers"},{"q":"What is the minimum normal following interval recommended by Kentucky's manual?","options":["1 second","2 seconds","3 seconds","4 seconds"],"a":3,"why":"Keep at least a four-second following distance; more is needed in poor conditions.","page":51,"category":"Important numbers"},{"q":"Without a posted limit, what is Kentucky's speed limit on interstates and parkways?","options":["65 mph","55 mph","45 mph","70 mph"],"a":0,"why":"The default for interstates and parkways is 65 mph; specifically authorized roads may be posted at 70 mph.","page":49,"category":"Important numbers"},{"q":"Without a posted sign, what is the limit on other Kentucky state highways?","options":["45 mph","55 mph","65 mph","70 mph"],"a":1,"why":"Other state highways have a 55 mph default speed limit.","page":49,"category":"Important numbers"},{"q":"Without a posted sign, what is the limit in business or residential districts?","options":["15 mph","25 mph","35 mph","45 mph"],"a":2,"why":"Kentucky lists 35 mph as the default in business and residential districts.","page":49,"category":"Important numbers"},{"q":"What is the default limit for an off-street parking facility offered for public use?","options":["5 mph","10 mph","25 mph","15 mph"],"a":3,"why":"The manual specifies a 15 mph limit for public-use off-street parking facilities.","page":49,"category":"Important numbers"},{"q":"At what time period does Kentucky require headlights to be on?","options":["From 30 minutes after sunset to 30 minutes before sunrise","From sunset to sunrise only in winter","Only when the sun has fully disappeared","From 1 hour after sunset to sunrise"],"a":0,"why":"Headlights must be illuminated starting one-half hour after sunset until one-half hour before sunrise.","page":54,"category":"Important numbers"},{"q":"You must dim high beams within how many feet of oncoming traffic?","options":["200 feet","500 feet","300 feet","100 feet"],"a":1,"why":"Dim high beams within 500 feet of an approaching vehicle.","page":68,"category":"Important numbers"},{"q":"When following another vehicle, dim high beams within what distance?","options":["100 feet","200 feet","300 feet","500 feet"],"a":2,"why":"Dim high beams within 300 feet of a vehicle you follow.","page":68,"category":"Important numbers"},{"q":"On a road with one lane in your direction, how much clearance should you give a bicycle when passing, if possible?","options":["1 foot","2 feet","4 feet","At least 3 feet"],"a":3,"why":"When passing a bicycle on a single-lane-direction roadway, keep at least 3 feet of clearance.","page":48,"category":"Important numbers"},{"q":"Before changing lanes, how should you check a blind spot?","options":["Turn your head and look over your shoulder","Rely only on the rearview mirror","Rely only on a blind-spot warning light","Assume the lane is clear if you signaled"],"a":0,"why":"Mirrors do not cover all blind spots; look over your shoulder toward the new lane.","page":46,"category":"Road-test skills"},{"q":"When making a right turn, where should you position the vehicle?","options":["Near the center line","In the right-most portion of the proper lane","In whichever lane has fewer cars","Across two lanes to widen the turn"],"a":1,"why":"Make right turns from the right-most portion of your lane without swinging wide.","page":42,"category":"Road-test skills"},{"q":"If there are multiple marked turn lanes, what should you do while turning?","options":["Move toward the clearest adjacent lane","Change lanes halfway through the turn","Maintain your chosen turn lane until the turn is completed","Turn into whichever lane has a faster opening"],"a":2,"why":"Stay within your designated lane through the turn; change lanes only after the turn when safe.","page":42,"category":"Road-test skills"},{"q":"What should you do FIRST when preparing to parallel park?","options":["Immediately shift to reverse","Turn the wheel sharply without signaling","Stop in the travel lane and wait indefinitely","Identify a space, check traffic, and signal"],"a":3,"why":"The parallel-parking process starts by choosing a space, checking traffic, and signaling.","page":45,"category":"Road-test skills"},{"q":"When reversing, where should you primarily look?","options":["Directly through the rear window, while also checking mirrors","Only at the backup camera screen","Only at the side mirror","Straight ahead to keep the wheel centered"],"a":0,"why":"The manual instructs drivers to look back through the rear window and use mirrors as support.","page":33,"category":"Road-test skills"},{"q":"For the driveway turnabout described in the manual, how far should your vehicle be visible in either direction?","options":["200 feet","500 feet","100 feet","300 feet"],"a":1,"why":"The turnabout instructions call for visibility for 500 feet in each direction.","page":43,"category":"Road-test skills"},{"q":"When parking on a hill without a curb, how should you angle the wheels?","options":["Straight ahead","So the vehicle would roll into traffic","So a rolling vehicle would go off the road","Toward the center of the road"],"a":2,"why":"Without a curb, turn the wheels so the vehicle rolls off the roadway instead of into traffic.","page":46,"category":"Road-test skills"},{"q":"Which controls may the examiner ask you to demonstrate before the road test?","options":["Only your car radio and heater","Only the steering wheel and seat adjuster","Only the GPS and backup camera","Headlights, turn signals, horn, wipers, and emergency flashers"],"a":3,"why":"The vehicle inspection includes lights, turn signals, dimmer, emergency brake, horn, flashers, wipers, and brake lights.","page":11,"category":"Road-test skills"},{"q":"Which maneuver is specifically included in Kentucky's road skills test?","options":["Parallel parking","Driving on a racetrack","Driving at maximum interstate speed","Performing a tire change"],"a":0,"why":"The road skills test includes parallel parking, backing, turnabouts, hill starts, and other normal road tasks.","page":13,"category":"Road-test skills"},{"q":"What can cause an automatic failure on the Kentucky road test?","options":["Asking the examiner to repeat an instruction","A traffic violation or dangerous act","Driving below the limit when conditions require it","Using mirrors before a lane change"],"a":1,"why":"The manual says collisions, traffic violations, or dangerous acts may result in automatic road-test failure.","page":13,"category":"Road-test skills"}],[{"q":"A pedestrian is crossing at an unmarked crosswalk at an intersection. What must you do?","options":["Yield to the pedestrian","Continue if there are no painted lines","Flash headlights and continue","Sound the horn until they move"],"a":0,"why":"Kentucky requires yielding to pedestrians in marked and unmarked crosswalks.","page":59,"category":"Sharing the road"},{"q":"You see a pedestrian using a visible white cane near a crosswalk. What is required?","options":["Only slow down if they wave","Yield right-of-way to the blind pedestrian","Honk twice to announce yourself","Stop only if another driver stops first"],"a":1,"why":"A blind pedestrian with a white cane or assistance dog has right-of-way under Kentucky law.","page":59,"category":"Sharing the road"},{"q":"Why should you avoid honking your horn at a blind pedestrian?","options":["It is only allowed at night","It can damage car headlights","It may startle and confuse the pedestrian","It gives pedestrians an automatic green signal"],"a":2,"why":"The manual warns that a blind pedestrian may not know whom the horn is directed toward.","page":60,"category":"Sharing the road"},{"q":"A reduced school-zone speed limit is active because lights are flashing. What should you do?","options":["Drive at the standard residential limit","Drive at normal speed if no officer is present","Drive at least 10 mph below every sign","Obey the reduced posted school-zone speed"],"a":3,"why":"The active school-zone speed limit must be followed when the lights are flashing or children are present as indicated.","page":59,"category":"Sharing the road"},{"q":"On a two-lane-per-direction limited-access highway, what is the general role of the left lane?","options":["Passing other vehicles","Parking temporarily","Continuous cruising at any speed","Entering the highway"],"a":0,"why":"The left lane is generally for passing, and lingering there on limited-access highways is prohibited.","page":46,"category":"Lane use"},{"q":"You pass your intended exit on an interstate. What should you do?","options":["Back up along the shoulder","Continue to the next exit and return safely","Make a U-turn through the median","Stop in your lane and turn on hazard lights"],"a":1,"why":"Never reverse or turn around on an interstate because you missed an exit.","page":53,"category":"Lane use"},{"q":"On a two-lane road, Kentucky says a pass must be completed before you come within how many feet of an oncoming vehicle?","options":["100 feet","150 feet","200 feet","500 feet"],"a":2,"why":"The manual specifies completing the pass before coming within 200 feet of oncoming traffic.","page":47,"category":"Passing"},{"q":"You begin passing on a two-way road. When must the pass be finished relative to a marked no-passing zone?","options":["Before the end of the no-passing zone","Only before sunset","Before an oncoming truck approaches","Before the no-passing zone begins"],"a":3,"why":"You must finish passing before reaching the beginning of the no-passing zone.","page":47,"category":"Passing"},{"q":"A hill blocks your view of oncoming traffic. Should you start passing?","options":["No, assume a vehicle may be approaching unseen","Yes, if your engine accelerates quickly","Yes, if the lane appears empty at the crest","Only if the car in front is slow"],"a":0,"why":"Do not begin passing where a hill or curve blocks sight distance.","page":48,"category":"Passing"},{"q":"Before returning to your lane after overtaking a vehicle, what is a useful sign that you have enough room?","options":["You can see its headlights in your side mirror","The whole front of the vehicle you passed is visible in your rearview mirror","The passing vehicle sounds its horn","Its brake lights turn off"],"a":1,"why":"The manual recommends confirming the complete front of the passed vehicle is visible in your rearview mirror.","page":47,"category":"Passing"},{"q":"When may a driver pass another vehicle on the right?","options":["Whenever the left lane is busy","Only at night","Only when it can be done safely under the rules","By driving onto the sidewalk"],"a":2,"why":"Passing on the right is allowed only in limited safe circumstances; it cannot ordinarily involve leaving the roadway.","page":47,"category":"Passing"},{"q":"How far ahead should an alert driver ideally scan the road?","options":["2 to 4 seconds","5 to 8 seconds","10 to 15 seconds","20 to 30 seconds"],"a":3,"why":"The manual encourages looking about 20–30 seconds ahead to recognize hazards early.","page":49,"category":"Defensive driving"},{"q":"What should you do to your following distance during heavy rain?","options":["Increase it beyond the ordinary minimum","Cut it in half to watch the car ahead","Maintain exactly one second","Ignore following distance at low speeds"],"a":0,"why":"Poor weather increases stopping distances, so leave more than the normal four seconds.","page":51,"category":"Defensive driving"},{"q":"For night driving on unfamiliar roads, how much extra following time does the manual recommend?","options":["One-half second","At least two additional seconds","Exactly no extra seconds","At least six additional seconds"],"a":1,"why":"The manual advises adding at least two extra seconds on unfamiliar roads at night.","page":68,"category":"Defensive driving"},{"q":"Visibility in thick fog is only about 100 feet. The manual says you cannot safely drive faster than approximately what?","options":["55 mph","40 mph","25 mph","65 mph"],"a":2,"why":"At 100 feet of visibility the manual warns that driving above about 25 mph is unsafe and recommends low beams.","page":50,"category":"Defensive driving"},{"q":"When should you reduce speed for a sharp curve?","options":["After you start drifting outward","When you reach the apex","Only if another driver signals","Before entering the curve"],"a":3,"why":"Slow to a safe speed before the curve to avoid losing traction when braking inside it.","page":50,"category":"Defensive driving"},{"q":"What is hydroplaning?","options":["Tires riding on water rather than gripping the road surface","Engine overheating during a long drive","Brakes getting too hot on a steep hill","Driving too close to a large truck"],"a":0,"why":"Hydroplaning happens when tires lose road contact as they ride over a layer of water.","page":50,"category":"Defensive driving"},{"q":"You find a roadway covered with a large body of standing floodwater. What does the manual recommend?","options":["Cross as long as another driver goes first","Find another route","Drive through at the speed limit","Drive with high beams on"],"a":1,"why":"Do not drive through significant standing water; take another route.","page":50,"category":"Defensive driving"},{"q":"You need to brake hard in a vehicle with working anti-lock brakes (ABS). What should you do?","options":["Pump the pedal repeatedly","Apply the parking brake first","Press firmly and keep pressure on the brake","Release the brake at each click"],"a":2,"why":"ABS works when you maintain firm pedal pressure; vibration can be normal.","page":55,"category":"Emergencies"},{"q":"Your vehicle begins to skid sideways. How should you steer to regain control?","options":["Opposite the direction the rear is skidding","Straight until the car stops by itself","Toward the nearest roadside ditch","In the direction the rear of the car is skidding"],"a":3,"why":"Turn toward the direction of the rear-wheel skid, then straighten as the vehicle recovers.","page":56,"category":"Emergencies"},{"q":"A tire blows out while you are driving. What is the best initial response?","options":["Hold the wheel firmly and slow gradually","Brake as hard as possible immediately","Accelerate to stabilize the tire","Turn sharply onto the shoulder"],"a":0,"why":"Maintain steering control and reduce speed gradually; avoid abrupt hard braking.","page":57,"category":"Emergencies"},{"q":"Your accelerator sticks and the car keeps speeding up. Which step is part of the manual's response?","options":["Shift into park immediately","Shift to neutral and find a safe place to pull over","Pull the parking brake sharply at speed","Steer into an occupied travel lane"],"a":1,"why":"The manual recommends shifting to neutral, finding a safe escape path, and pulling over with controlled braking.","page":58,"category":"Emergencies"},{"q":"Your car has mechanical trouble on a highway. Where should you stop if possible?","options":["Just beyond the crest of a hill","In the left travel lane","Completely off the roadway, preferably on the right","In the middle of a curve"],"a":2,"why":"Pull fully off the roadway when possible, avoiding locations where other drivers cannot see your vehicle.","page":58,"category":"Emergencies"},{"q":"The manual recommends placing emergency flares approximately how far behind a broken-down vehicle?","options":["20–40 feet","50–100 feet","100–150 feet","200–300 feet"],"a":3,"why":"Emergency flares placed about 200–300 feet behind give approaching drivers warning.","page":58,"category":"Emergencies"},{"q":"After a collision with no injuries, Kentucky's manual says damaged vehicles should generally be moved where?","options":["To the road shoulder","Left in the travel lane even if drivable","To the nearest dealership","Across the median"],"a":0,"why":"Kentucky law instructs drivers involved in a non-injury accident to move damaged vehicles to the shoulder.","page":56,"category":"Emergencies"},{"q":"If a collision causes more than $500 in property damage and police do not investigate, when does the manual say to file a written report with Kentucky State Police?","options":["Within 24 hours","Within 10 days","Within 30 days","Only when insurance requests it"],"a":1,"why":"The manual requires a civilian written accident report within ten days in that situation.","page":56,"category":"Emergencies"},{"q":"In thick fog, which headlight setting is usually best?","options":["High beams to light more fog","Parking lights alone","Low beams to reduce glare","Hazard lights while driving normally"],"a":2,"why":"Low beams reduce reflected glare in fog, rain, and snow.","page":68,"category":"Night driving"},{"q":"When should high beams generally be used at night?","options":["Whenever another car approaches","When following closely behind a vehicle","In heavy fog","When no oncoming vehicles are present and other traffic won't be dazzled"],"a":3,"why":"High beams improve distance vision but must be dimmed for other drivers.","page":68,"category":"Night driving"},{"q":"You approach a stopped emergency vehicle on a four-lane highway. What should you do when safe?","options":["Slow down and move to a lane away from the emergency vehicle","Maintain speed and stay beside it","Honk and accelerate past","Stop beside it and ask if help is needed"],"a":0,"why":"Kentucky's move-over guidance calls for slowing and moving away a lane when it is safe.","page":65,"category":"Emergency vehicles"},{"q":"An emergency vehicle approaches with flashing lights and siren. What should you generally do?","options":["Speed up to stay ahead of it","Yield and pull toward the right edge of the road to let it pass","Stop directly inside the intersection","Follow it through traffic"],"a":1,"why":"Drivers must yield and pull over at the road edge for emergency vehicles using lights and siren.","page":64,"category":"Emergency vehicles"},{"q":"A reflective orange-and-red triangle on the back of a rural vehicle means what?","options":["The vehicle carries hazardous chemicals","The vehicle is entering a freeway","It is traveling below 25 mph","It is towing a disabled car"],"a":2,"why":"This emblem marks a slow-moving vehicle traveling less than 25 mph.","page":66,"category":"Sharing the road"},{"q":"What does a truck's NO-ZONE refer to?","options":["An area where cars may always pass","The truck's designated parking area","The space for loading cargo","Blind spots around the truck"],"a":3,"why":"No-zones are large blind spots to the front, sides, and rear of a truck or bus.","page":63,"category":"Sharing the road"},{"q":"If you cannot see a truck driver's face in the truck's side mirror, what should you assume?","options":["The truck driver likely cannot see you","The truck is preparing to brake","The truck is about to turn left","The truck is out of service"],"a":0,"why":"If you cannot see the driver's face in the mirror, you are likely hidden in a large-vehicle blind spot.","page":63,"category":"Sharing the road"},{"q":"How much lane width should you allow a motorcycle traveling next to you?","options":["Half a lane","A full lane","Only enough room for the handlebars","No special space if traffic is slow"],"a":1,"why":"Motorcyclists are entitled to a full lane and need room to maneuver around hazards.","page":62,"category":"Sharing the road"},{"q":"A motorcycle ahead has its turn signal on, but continues straight. What is safest?","options":["Turn in front of it as indicated","Honk to force it to turn","Wait to confirm the rider actually turns","Assume the rider will stop immediately"],"a":2,"why":"Motorcycle signals may not self-cancel; never assume a rider will turn solely because a signal flashes.","page":62,"category":"Sharing the road"},{"q":"When following a motorcyclist in good conditions, what minimum interval does the manual recommend?","options":["One second","Two seconds","Three seconds","Four seconds"],"a":3,"why":"Give motorcycles at least four seconds, and more in wet conditions.","page":62,"category":"Sharing the road"},{"q":"A steady green arrow points left over your lane. What does this mean?","options":["You may proceed left in the proper lane if the path is clear","All traffic must stop","Only pedestrians may go left","You may turn only after the arrow becomes yellow"],"a":0,"why":"A green directional arrow allows travel in that direction from the proper lane.","page":35,"category":"Traffic signals"},{"q":"What does a steady red left-turn arrow mean?","options":["Turn left if no cars are approaching","Do not turn in the arrow's direction until it changes to green","Turn left after two seconds","Stop only if other traffic is moving"],"a":1,"why":"A red arrow prohibits the indicated turn until the arrow turns green.","page":35,"category":"Traffic signals"},{"q":"Two alternating flashing red lights at railroad tracks mean what?","options":["Slow down and cross immediately","Stop only if you can see a train","Stop; cross only when lights stop and you confirm no train is approaching","Make a U-turn without looking"],"a":2,"why":"Two flashing red lights mark an active railroad warning requiring a complete stop.","page":35,"category":"Railroad crossings"},{"q":"What does the white X-shaped railroad CROSSBUCK sign mean?","options":["You always have the right-of-way","You must always stop for 60 seconds","The crossing is permanently closed","Yield to trains and stop if a train is approaching"],"a":3,"why":"The crossbuck means to yield to rail traffic; stop when a train is approaching.","page":35,"category":"Railroad crossings"},{"q":"Your vehicle becomes stuck on railroad tracks and a train approaches. What should you do first?","options":["Exit the car immediately and move to safety","Stay in the car and try the starter again","Stand behind the car and wave","Wait for the gate to go back up"],"a":0,"why":"Leave a stranded vehicle immediately; the manual directs people to move away toward the approaching train's direction to avoid debris.","page":37,"category":"Railroad crossings"},{"q":"When may speeding fines be doubled in a Kentucky highway work zone, according to the manual's specific rule?","options":["Whenever traffic is heavy","When required warning signs are displayed and at least one bona fide worker is present","Only when road equipment is moving","Only after sunset"],"a":1,"why":"The work-zone section says doubling requires posted notices about doubled fines and at least one worker present.","page":69,"category":"Work zones"},{"q":"A child measuring 40 inches tall or less rides in your vehicle. What is Kentucky's rule?","options":["Use an adult belt without a child seat","Sit in the front seat with an adult","Use an appropriate child restraint system","Use a booster seat only when the child asks"],"a":2,"why":"The manual requires an appropriate child restraint for children 40 inches or less in height.","page":31,"category":"Safety & vehicle"},{"q":"Which child generally needs a booster seat under Kentucky's rule?","options":["An 11-year-old who is 60 inches tall","A 9-year-old who is 58 inches tall","An 8-year-old who is 58 inches tall","A 7-year-old who is 50 inches tall"],"a":3,"why":"Children under eight between 40 and 57 inches tall must use a booster seat.","page":31,"category":"Safety & vehicle"},{"q":"For a motor vehicle manufactured after 1981 on Kentucky public roads, who must wear seat belts?","options":["The driver and all passengers","Only the driver","Only front-seat occupants","Only passengers younger than 18"],"a":0,"why":"Kentucky's manual says the driver and every passenger must use a properly adjusted seat belt.","page":12,"category":"Safety & vehicle"},{"q":"Which feature does Kentucky's manual say you may NOT use during the driving test?","options":["Seat belts","Cruise control or automatic parking assist","Standard mirrors","Regular turn signals"],"a":1,"why":"Parking assistance and cruise control cannot be used during the road test.","page":32,"category":"Road-test skills"},{"q":"Once parked in a parallel-parking space, what should you do to secure the vehicle?","options":["Leave the gear selector in neutral","Keep the engine idling with the foot brake","Set the parking brake and select park","Turn the front wheels toward the travel lane"],"a":2,"why":"After parking, secure the vehicle by setting the parking brake and shifting to park (or reverse in a manual car).","page":45,"category":"Road-test skills"},{"q":"You are about to back out of a parking space into moving traffic. What does the manual advise when possible?","options":["Back out quickly so other traffic can react","Keep your eyes only on the backup monitor","Reverse without slowing so the engine does not stall","Avoid backing into traffic or have someone help if needed"],"a":3,"why":"Backing into traffic is hazardous, so avoid it when possible and use a spotter if appropriate.","page":53,"category":"Road-test skills"},{"q":"On a horizontally arranged traffic signal, where is the red light normally located?","options":["On the left","On the right","In the middle","Below the yellow light"],"a":0,"why":"The manual shows that a horizontal signal places red on the left, yellow in the middle, and green on the right.","page":34,"category":"Traffic signals"},{"q":"Before slowing or stopping in normal traffic, what should you check to know what is behind you?","options":["Your dashboard clock","Your mirrors","Your radio display","Your passenger-side window only"],"a":1,"why":"Check rear traffic in your mirrors before slowing, stopping, or changing lanes.","page":49,"category":"Defensive driving"}]]};
const STORAGE_KEY='ky-driver-quiz-2026-five-rounds-v3';
const POOL=DATA.sets.flat();
const LETTERS=['A','B','C','D'];
const $app=document.getElementById('app');
function blankState(){
 const order=POOL.map((_,i)=>i);
 for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
 return {stage:'welcome',index:0,order,answers:Array(100).fill(null)};
}
let state=blankState();
try{
 const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
 if(v&&['welcome','quiz','result'].includes(v.stage)&&Number.isInteger(v.index)&&v.index>=0&&v.index<100&&Array.isArray(v.order)&&v.order.length===100&&new Set(v.order).size===100&&v.order.every(i=>Number.isInteger(i)&&i>=0&&i<100)&&Array.isArray(v.answers)&&v.answers.length===100&&v.answers.every(a=>a===null||Number.isInteger(a)&&a>=0&&a<4))state=v;
}catch(e){}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function escapeHTML(x){return String(x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function sourceLink(p){return `<a href="https://wp.kentuckystatepolice.ky.gov/wp-content/uploads/2026/07/Kentucky-Driver-Manual_Updated_7-23-26.pdf#page=${p+8}" target="_blank" rel="noopener noreferrer">Manual p. ${p}</a>`;}
function newButton(action,label,kind=''){return `<button type="button" class="button ${kind}" data-action="${action}">${label}</button>`;}
function metric(title,num,cls=''){return `<div class="metric"><div class="big ${cls}">${num}</div><div class="kicker">${title}</div></div>`}

function headerTag(round){return `ROUND ${round+1} OF 5 · 20 QUESTIONS`;}
function renderWelcome(){
 $app.innerHTML=`<section class="hero"><span class="eyebrow">Kentucky knowledge test • Practice edition</span><h1>Five rounds.<br>20 questions each.</h1><p class="lede">Practice with 100 randomly ordered questions. Stop after any round or keep going through all five.</p></section><section class="panel"><h2>20 · 20 · 20 · 20 · 20</h2><p class="secondaryText">Choose one answer per question, then see the correct answer and explanation. Each answer locks immediately. After every round, see your round score and your overall percentage based only on answered questions. Continue whenever you are ready.</p><p class="secondaryText">Every new attempt shuffles the full question bank, with no repeats within an attempt. Progress is saved where supported.</p><div class="notice">Practice target: 80% or higher. This quiz is not an official exam.</div><div class="actionline">${newButton('start','Start Round 1 →')}</div></section>`;
}
function renderQuestion(){
 const r=Math.floor(state.index/20),i=state.index%20,q=POOL[state.order[state.index]],chosen=state.answers[state.index],locked=chosen!==null,good=locked&&chosen===q.a;
 const choices=q.options.map((opt,k)=>{let cls=locked?(k===q.a?' correct':(k===chosen?' wrong':' locked')):'';let status=locked&&k===q.a?'<span class="status">✓ Correct</span>':(locked&&k===chosen?'<span class="status">✗ Your pick</span>':'');return `<button type="button" class="choice${cls}" data-choice="${k}" ${locked?'disabled':''} aria-label="Option ${LETTERS[k]}: ${escapeHTML(opt)}"><span class="letter">${LETTERS[k]}</span><span class="optionText">${escapeHTML(opt)}</span>${status}</button>`}).join('');
 const feedback=locked?`<div class="feedback ${good?'good':'bad'}" role="status"><strong>${good?'✓ Correct answer':'✗ Not quite — answer locked'}</strong>${!good?`<p><b>Correct answer: ${LETTERS[q.a]}. ${escapeHTML(q.options[q.a])}</b></p>`:''}<p>${escapeHTML(q.why)}</p><small>${sourceLink(q.page)} · ${escapeHTML(q.category)}</small></div>`:'';
 $app.innerHTML=`<section class="panel"><div class="question-head"><div><span class="eyebrow">${headerTag(r)}</span><div class="tracker">Question ${i+1} of 20</div></div><span class="pill">${escapeHTML(q.category)}</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="${i+(locked?1:0)}" aria-label="Question progress"><div style="width:${(i+(locked?1:0))*5}%"></div></div><h2 class="qtitle">${escapeHTML(q.q)}</h2><div class="choice-list" role="group" aria-label="Answer options">${choices}</div>${feedback}<div class="actions"><div class="fine">${locked?'Answer saved and locked. You can continue.':'Choose the single best answer.'}</div><button type="button" data-action="next" class="button" ${locked?'':'disabled'}>${i===19?`Score round ${r+1} →`:'Next question →'}</button></div></section>`;
}

function score(from,to){let count=0,correct=0;for(let i=from;i<to;i++){if(state.answers[i]!==null){count++;if(state.answers[i]===POOL[state.order[i]].a)correct++;}}return {count,correct,pct:count?Math.round(correct/count*100):0};}
function renderReview(){
 return `<div class="rule"><h3>Review answered questions</h3><div class="review-list">${state.order.map((id,i)=>{
 const a=state.answers[i];if(a===null)return '';const q=POOL[id],right=a===q.a;
 return `<div class="reviewItem"><span class="pill">Round ${Math.floor(i/20)+1} · Question ${i%20+1} · ${right?'Correct':'Review'}</span><p><b>${escapeHTML(q.q)}</b></p><p class="${right?'right-answer':'wrong-answer'}">Your answer: ${LETTERS[a]}. ${escapeHTML(q.options[a])}</p>${right?'':`<p class="right-answer">Correct answer: ${LETTERS[q.a]}. ${escapeHTML(q.options[q.a])}</p>`}<p>${escapeHTML(q.why)}</p><div class="ref">${sourceLink(q.page)}</div></div>`;
 }).join('')}</div></div>`;
}
function renderResult(){
 const round=Math.floor(state.index/20),total=score(0,100),current=score(round*20,(round+1)*20),done=total.count===100;
 $app.innerHTML=`<section class="panel"><span class="eyebrow">Round ${round+1} of 5 completed</span><h1>${done?'Your final results':`Your Round ${round+1} results`}</h1><p class="lede">${done?'You completed all five rounds.':'Stop here or continue to the next 20 questions. Your progress is saved where supported.'}</p><div class="result-grid">${metric('This round',`${current.correct}/${current.count}`)}${metric('Round percentage',`${current.pct}%`)}${metric('Overall correct',`${total.correct}/${total.count}`)}${metric('Overall percentage',`${total.pct}%`,'successText')}${metric('Wrong answers',total.count-total.correct)}${metric('Rounds completed',`${round+1}/5`)}</div><p class="secondaryText">Overall percentage = correct answers ÷ answered questions × 100. Unanswered questions do not count.</p><h3>Scores by round</h3><div class="topic-grid">${Array.from({length:round+1},(_,r)=>{const v=score(r*20,(r+1)*20);return `<div class="topicItem"><span>Round ${r+1}</span><b>${v.correct}/${v.count} · ${v.pct}%</b></div>`}).join('')}</div><div class="actionline">${done?'':newButton('continue',`Continue to Round ${round+2} →`)}${newButton('review','Review answered questions','secondary')}${newButton('restart','Start a new randomized attempt','secondary')}</div><div id="reviewArea"></div></section>`;
}
function render(){if(state.stage==='welcome')renderWelcome();else if(state.stage==='quiz')renderQuestion();else renderResult();}
function scrollUp(){window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{
 const choice=e.target.closest('[data-choice]');
 if(choice&&state.stage==='quiz'){
  const a=Number(choice.dataset.choice);if(state.answers[state.index]!==null||!Number.isInteger(a)||a<0||a>3)return;
  state.answers[state.index]=a;persist();render();return;
 }
 const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
 if(action==='reset'){if(!confirm('Reset quiz? This will clear all answers and scores, reshuffle the questions, and return you to the start.'))return;state=blankState();}
 else if(action==='start'&&state.stage==='welcome')state.stage='quiz';
 else if(action==='next'&&state.stage==='quiz'&&state.answers[state.index]!==null){if((state.index+1)%20===0)state.stage='result';else state.index++;}
 else if(action==='continue'&&state.stage==='result'&&state.index<99){state.index++;state.stage='quiz';}
 else if(action==='restart'){if(!confirm('Start a new randomized attempt? This will erase your current answers and scores.'))return;state=blankState();}
 else if(action==='review'&&state.stage==='result'){const area=document.getElementById('reviewArea');area.innerHTML=area.innerHTML?'':renderReview();return;}
 else return;
 persist();render();scrollUp();
});
render();
</script>
</body>
</html>
